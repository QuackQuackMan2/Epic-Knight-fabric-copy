name: CI

on:
  push:
    branches: ["main", "fabric-1.21.4", "fabric-1.21.4-port"]
  pull_request:
    branches: ["main", "fabric-1.21.4", "fabric-1.21.4-port"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Build with tests
        run: ./gradlew clean build --no-daemon

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Install xvfb for headless client validation
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run headless client startup check
        run: xvfb-run --auto-servernum --server-args='-screen 0 1024x768x24' ./gradlew runClient --no-daemon || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: epic-knights-fabric-1.21.4
          path: |
            common/build/libs/*.jar
            fabric/build/libs/*.jar
